# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.13.12
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.6

clusterName: "home-kubernetes"
endpoint: https://10.90.3.100:6443
clusterPodNets:
  - "10.69.0.0/16"
clusterSvcNets:
  - "10.96.0.0/16"
additionalApiServerCertSans: &sans
  - "10.90.3.100"
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "stanton-01"
    ipAddress: "10.90.3.101"
    installDiskSelector:
      serial: "S5XMNE0TC58615"   # PM9A3 960GB (was 990 PRO S73VNU0X303066H, pulled 2026-05-26 for RMA return)
    talosImageURL: factory.talos.dev/metal-installer/786a10aa2924e5caf00392a569de037cec138416143517e618d151b8176af7f3
    controlPlane: true
    # Network interfaces are in the patch below, in legacy form, so that the
    # generated config matches the node. See the header of that file.
    patches:
      - "@./patches/nodes/stanton-01-network.yaml"
  ###################################################################
  ###################################################################
  - hostname: "stanton-02"
    ipAddress: "10.90.3.102"
    installDiskSelector:
      serial: "S5XMNE2TC24056"   # PM9A3 960GB (was 990 PRO S73VNU0X303413H, pulled 2026-05-26 for RMA return)
    talosImageURL: factory.talos.dev/metal-installer/786a10aa2924e5caf00392a569de037cec138416143517e618d151b8176af7f3
    controlPlane: true
    # Network interfaces are in the patch below, in legacy form, so that the
    # generated config matches the node. See the header of that file.
    patches:
      - "@./patches/nodes/stanton-02-network.yaml"
  ###################################################################
  ###################################################################
  - hostname: "stanton-03"
    ipAddress: "10.90.3.103"
    installDiskSelector:
      serial: "S5XMNE1TC99141"   # PM9A3 960GB (was 990 PRO S73VNU0X303400H, pulled 2026-05-26 for RMA return)
    talosImageURL: factory.talos.dev/metal-installer/786a10aa2924e5caf00392a569de037cec138416143517e618d151b8176af7f3
    controlPlane: true
    # Network interfaces are in the patch below, in legacy form, so that the
    # generated config matches the node. See the header of that file.
    patches:
      - "@./patches/nodes/stanton-03-network.yaml"
