cluster:
  apiServer:
    extraArgs:
      # No feature-gates: MutatingAdmissionPolicy is GA and on by default in
      # 1.36, and ImageVolume is GA and locked on. Leaving a locked gate set
      # stops the component starting once the gate is removed from the code.
      #
      # v1beta1 stays until the cluster is on 1.37: a 1.36 apiserver still
      # WRITES these objects to etcd as v1beta1 (1.37 moves storage to v1), and
      # a 1.35 apiserver reads v1beta1, so it is also needed for any rollback.
      # v1alpha1 is gone: the VolSync policies are v1 in git and were rewritten
      # in etcd on 2026-11-15. It stops being served in 1.38 anyway.
      runtime-config: admissionregistration.k8s.io/v1beta1=true
