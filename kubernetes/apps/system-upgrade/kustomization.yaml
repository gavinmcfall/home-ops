---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade

# The common component supplies the namespace, cluster vars, alerts and the
# sops-age secret. Every Flux Kustomization is patched to decrypt with
# sops-age, so without it the tuppr Kustomization fails to build
# ("secrets sops-age not found").
components:
  - ../../components/common

resources:
  - ./tuppr/ks.yaml
