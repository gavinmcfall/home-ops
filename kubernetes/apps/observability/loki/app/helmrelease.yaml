---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: 18.13.5
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: openebs
      namespace: openebs-system
  values:
    deploymentMode: Monolithic
    sidecar:
      rules:
        # The loki_rule ConfigMaps live in the app namespaces (downloads, entertainment),
        # not here; the chart default only watches the release namespace.
        searchNamespace: ALL
    loki:
      auth_enabled: false
      rulerConfig:
        # Deliver rule alerts to the in-cluster Alertmanager.
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
        # The sidecar drops rule files at /rules/<tenant>; read them from there and keep the
        # ruler's scratch copies elsewhere (its default scratch path is also /rules).
        rule_path: /tmp/loki/rules-scratch
        storage:
          type: local
          local:
            directory: /rules
      analytics:
        reporting_enabled: false
      server:
        log_level: info
      commonConfig:
        replication_factor: 1
      ingester:
        chunk_encoding: snappy
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      compactor:
        working_directory: /var/loki/compactor/retention
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 14d
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 50Gi
    gateway:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
