---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-sonarr
  labels:
    app.kubernetes.io/instance: exportarr-sonarr
    app.kubernetes.io/name: exportarr-sonarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-sonarr
  endpoints:
    # ENABLE_ADDITIONAL_METRICS makes ~3 API calls per series (451 series):
    # a scrape takes 40-55s and overran the old 1m timeout under load.
    # sonarr_episode_quality_total (Grafana 12530 quality panel) needs it.
    # Keep interval under Prometheus' 5m lookback so instant queries never gap.
    - port: sonarr
      interval: 4m
      scrapeTimeout: 3m
      path: /metrics
    - port: sonarr-uhd
      interval: 1m
      scrapeTimeout: 30s
      path: /metrics
    - port: sonarr-foreign
      interval: 2m
      scrapeTimeout: 45s
      path: /metrics
