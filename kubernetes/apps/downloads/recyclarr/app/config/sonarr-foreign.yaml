# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
###################################################################################################
# Recyclarr Configuration: Sonarr Foreign                                                         #
# v8 schema: guide-backed quality_profile via trash_id.                                           #
# Based on WEB-1080p (V4) with x265 preference and 10bit boost.                                   #
###################################################################################################

sonarr:
  foreign:
    base_url: http://sonarr-foreign.downloads.svc.cluster.local:80
    api_key: !env_var SONARR_FOREIGN_API_KEY
    delete_old_custom_formats: true
    media_naming:
      series: plex-imdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    quality_profiles:
      # WEB-1080p — guide name matches existing profile
      - trash_id: 72dae194fc92bf828f32cde7744e51a1
        reset_unmatched_scores:
          enabled: false
      # HD-1080p — hand-made profile (142 shows), managed here for the x265
      # preference. 1080p sources share one group so x265 wins whenever one is
      # available. Upgrades were off; on now so existing x264 files move to x265.
      # No blocks exist in this profile and none are added.
      - name: HD-1080p
        reset_unmatched_scores:
          enabled: false
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 10000
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            enabled: false
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p

    custom_formats:
      # Unwanted (based on onedr0p's config)
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - name: WEB-1080p

      # x265 preference (space saving)
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: WEB-1080p
            score: 20
          - name: HD-1080p
            score: 10000
      - trash_ids:
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - name: WEB-1080p
            score: 20
          - name: HD-1080p
            score: 0
      - trash_ids:
          - b2550eb333d27b75833e25b8c2557b38 # 10bit
        assign_scores_to:
          - name: WEB-1080p
            score: 10
