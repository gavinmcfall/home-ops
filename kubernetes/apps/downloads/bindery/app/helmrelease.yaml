---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bindery
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      bindery:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Bindery (clean Readarr replacement) alongside the parked bookshelf.
            # Single Go binary + embedded SQLite, no external DB. Library/audiobook
            # dirs point at the real colocated genre-tree library so ABS-import can
            # mark on-disk books as owned; imports are metadata-first and never move
            # existing files (reorganize is an explicit, opt-in action only).
            image:
              repository: ghcr.io/vavallee/bindery
              tag: v1.28.2@sha256:696554382a4f7f376d7b75eae182b48714f44d507d0e6015fd9c22902ba4f5dc
            env:
              TZ: ${TIMEZONE}
              BINDERY_PORT: &port "8787"
              BINDERY_DATA_DIR: /config
              BINDERY_DB_PATH: /config/bindery.db
              # library + audiobook dirs = the real colocated genre-tree library so
              # ABS-import marks owned books; download dir stays the spike sandbox
              # until the grab workflow (new ebooks route through CWA) is designed.
              BINDERY_LIBRARY_DIR: /media/Library/Books/Books
              BINDERY_AUDIOBOOK_DIR: /media/Library/Books/Books
              BINDERY_DOWNLOAD_DIR: /media/Library/Books/.calibre/_bindery-test/downloads
              BINDERY_TELEMETRY_DISABLED: "true"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8787
                    path: /
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          internal-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        globalMounts:
          - path: /media
