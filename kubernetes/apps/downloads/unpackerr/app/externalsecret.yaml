---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unpackerr-secret
    template:
      engineVersion: v2
      data:
        UN_RADARR_0_API_KEY: "{{ .RADARR_API_KEY }}"
        UN_RADARR_1_API_KEY: "{{ .RADARR_UHD_API_KEY }}"
        UN_SONARR_0_API_KEY: "{{ .SONARR_API_KEY }}"
        UN_SONARR_1_API_KEY: "{{ .SONARR_UHD_API_KEY }}"
        UN_SONARR_2_API_KEY: "{{ .SONARR_FOREIGN_API_KEY }}"
        UN_WEBHOOK_0_URL: "https://notifiarr.com/api/v1/notification/unpackerr/{{ .NOTIFARR_UNPACKERR_API_KEY }}"
        # unpackerr v1: /metrics needs an API key holding system:metrics:read
        # (60-150 characters). The ServiceMonitor sends this one as a Bearer token.
        UN_WEBSERVER_API_KEYS_0_NAME: prometheus
        UN_WEBSERVER_API_KEYS_0_KEY: "{{ .UNPACKERR_METRICS_API_KEY }}"
        UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
        # v1 turns the web UI on with the HTTP server. Without a password it
        # prints a temporary admin one to the log on every start. Format user:pass.
        UN_WEBSERVER_UI_PASSWORD: "nerdzadmin:{{ .UNPACKERR_UI_PASSWORD }}"
  dataFrom:
    - extract:
        key: unpackerr
    - extract:
        key: radarr
    - extract:
        key: radarr-uhd
    - extract:
        key: sonarr
    - extract:
        key: sonarr-uhd
    - extract:
        key: sonarr-foreign
    - extract:
        key: notifarr
