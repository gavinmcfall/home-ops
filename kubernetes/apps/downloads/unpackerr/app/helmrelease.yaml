---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
            env:
              TZ: ${TIMEZONE}
              UN_WEBSERVER_METRICS: true
              UN_WEBSERVER_LOG_FILE: /logs/webserver.log
              UN_ACTIVITY: true
              # v1: a role that can only read metrics, for the Prometheus API key
              # in the secret. Role names in env are case-sensitive.
              UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read
              # Webhook - Notifiarr
              UN_WEBHOOK_0_NAME: Notifiarr
              UN_WEBHOOK_0_EVENTS_0: "0"
              # Sonarr
              UN_SONARR_0_URL: http://sonarr.downloads.svc.cluster.local
              UN_SONARR_0_PATHS_0: /media/Downloads/qbittorrent/complete/sonarr
              UN_SONARR_1_URL: http://sonarr-uhd.downloads.svc.cluster.local
              UN_SONARR_1_PATHS_0: /media/Downloads/qbittorrent/complete/sonarr-uhd
              # unpackerr 0.16 caps extracted size per instance (Sonarr 20GB, Radarr 75GB)
              # and fails the item with no retry when hit; 0 disables the cap for UHD.
              UN_SONARR_1_MAX_BYTES: "0"
              UN_SONARR_2_URL: http://sonarr-foreign.downloads.svc.cluster.local
              UN_SONARR_2_PATHS_0: /media/Downloads/qbittorrent/complete/sonarr-foreign
              # Radarr
              UN_RADARR_0_URL: http://radarr.downloads.svc.cluster.local
              UN_RADARR_0_PATHS_0: /media/Downloads/qbittorrent/complete/radarr
              UN_RADARR_1_URL: http://radarr-uhd.downloads.svc.cluster.local
              UN_RADARR_1_PATHS_0: /media/Downloads/qbittorrent/complete/radarr-uhd
              UN_RADARR_1_MAX_BYTES: "0"
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
            # Ignored by v0.16; required by v1.
            authorization:
              type: Bearer
              credentials:
                name: unpackerr-secret
                key: UN_WEBSERVER_API_KEYS_0_KEY
    persistence:
      logs:
        type: emptyDir
      media:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        globalMounts:
          # Must be the path Sonarr and Radarr report (their own /media mount).
          # It was /downloads/, so every queue item failed with "no such file
          # or directory" and nothing was ever extracted.
          - path: /media/Downloads/qbittorrent
            subPath: Downloads/qbittorrent
