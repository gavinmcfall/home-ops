---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app flaresolverr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      flaresolverr:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
            env:
              TZ: Pacific/Auckland
              LOG_LEVEL: info
              # Every in-flight challenge holds a Chrome instance open; skipping
              # images, CSS and fonts shrinks each one.
              DISABLE_MEDIA: true
              PROMETHEUS_ENABLED: true
              PROMETHEUS_PORT: &metricsPort 8192
            resources:
              requests:
                cpu: 15m
                memory: 512Mi
              limits:
                # 2Gi was breached on 2026-11-12 when concurrent unsolvable
                # challenges stacked on a baseline that leaks to ~700Mi over weeks.
                memory: 3Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: ${FLARESOLVERR_LBIP}
        ports:
          http:
            port: 8191
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
