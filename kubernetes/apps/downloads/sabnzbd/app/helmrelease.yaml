---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: storage
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
            env:
              TZ: ${TIMEZONE}
              SABNZBD__PORT: &port 80
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloads,
                sabnzbd.downloads.svc,
                sabnzbd.downloads.svc.cluster,
                sabnzbd.downloads.svc.cluster.local,
                sab.${SECRET_DOMAIN},
                sabnzbd.${SECRET_DOMAIN},
                sab.tail21dd8.ts.net
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 4Gi
          # SABnzbd keeps a gzipped copy of every nzb it processes in
          # nzb_backup_dir (= /config/history) and NEVER prunes it -- there is
          # no retention setting for that directory in its config at all. It had
          # grown to 4868 files / 557MB of this 1Gi volume (62% full).
          #
          # Worse, it made the backups unrestorable. One release name was 248
          # characters, and Kopia appends a ~10-digit temp suffix on restore,
          # pushing it past the 255-byte filename limit:
          #   cannot create temp file: ... .nzb.gz3432274550: file name too long
          # The ReplicationSource reported success the whole time while the
          # restore died at 70.8%, so sabnzbd's restore point sat on a
          # 2025-12-22 snapshot for ten months.
          #
          # A sidecar, not a CronJob, because the claim is ReadWriteOnce: a
          # separate pod would contend for the mount and break whenever sabnzbd
          # is rescheduled. Sharing the pod sidesteps that.
          #
          # NOTE: no braced shell expansions below. Flux patches
          # postBuild.substituteFrom onto every app Kustomization and envsubst
          # runs in strict mode, so a literal ${...} here fails the whole build
          # -- and kubeconform cannot catch it, because it validates the
          # kustomize output produced before postBuild runs.
          prune-nzb-backup:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            command:
              - /bin/sh
              - -c
              - |
                set -u
                HIST=/config/history
                while true; do
                  if [ -d "$HIST" ]; then
                    # Age prune bounds growth: 60d cleared 2224 of 4868 files
                    # when this was added.
                    find "$HIST" -type f -mtime +60 -delete 2>/dev/null || true
                    # Length guard is the actual fix for the unrestorable
                    # backup. 230 leaves room for Kopia's temp suffix in 255.
                    find "$HIST" -type f 2>/dev/null | while IFS= read -r f; do
                      n=$(printf %s "$f" | awk -F/ '{print length($NF)}')
                      [ "$n" -gt 230 ] && rm -f -- "$f"
                    done
                    echo "[prune] $(date -u +%FT%TZ) remaining=$(find "$HIST" -type f 2>/dev/null | wc -l)"
                  fi
                  sleep 86400
                done
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: SABnzbd
          gethomepage.dev/app: *app
          gethomepage.dev/icon: sabnzbd.png
          gethomepage.dev/description: NZB Download Client
          gethomepage.dev/widget.type: sabnzbd
          gethomepage.dev/widget.url: http://sabnzbd.downloads:80
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_SABNZBD_TOKEN}}` }}"
          internal-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hostnames:
          - sab.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: sabnzbd
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        globalMounts:
          - path: /media
