---
fullnameOverride: coredns
k8sAppLabelOverride: kube-dns
# This is the cluster's only DNS (kube-dns, 10.96.0.10). The chart defaults to a
# single replica with rollingUpdate.maxUnavailable=1, which terminates the one
# pod before its replacement is Ready — so every chart or image bump was a
# cluster-wide DNS gap. Two replicas let one roll while the other serves.
replicaCount: 2
# Keeps a voluntary disruption (node drain, eviction) from taking both at once.
podDisruptionBudget:
  minAvailable: 1
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.96.0.10"
servers:
  # Internal gateway rewrite - resolves internal services to ClusterIP
  # This works around Cilium DSR hairpin limitation (pods can't reach LB VIP on same node)
  # Services like id.nerdz.cloud CNAME to internal.nerdz.cloud which resolves to LB VIP externally
  # We intercept both the CNAME target and common internal services directly
  - zones:
      - zone: ${SECRET_DOMAIN}
        scheme: dns://
    port: 53
    plugins:
      - name: errors
      - name: log
        configBlock: |-
          class error
      - name: template
        parameters: IN A
        configBlock: |-
          match (^internal\.|^id\.)nerdz\.cloud\.$
          answer "{{ .Name }} 60 IN A ${ENVOY_INTERNAL_CLUSTERIP}"
          fallthrough
      - name: template
        parameters: IN AAAA
        configBlock: |-
          match (^internal\.|^id\.)nerdz\.cloud\.$
          rcode NOERROR
          fallthrough
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        parameters: 30
  # Internal domain - forward to UniFi for local DNS (citadel.internal, etc.)
  - zones:
      - zone: internal.
        scheme: dns://
    port: 53
    plugins:
      - name: errors
      - name: log
        configBlock: |-
          class error
      - name: forward
        parameters: . 10.90.254.1
      - name: cache
        parameters: 30
  # Default server
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: log
        configBlock: |-
          class error
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
