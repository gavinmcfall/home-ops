---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      kometa:
        type: cronjob
        # Deliberately NOT annotated with reloader.stakater.com/auto, unlike
        # most apps here. On an annotated CronJob, Reloader triggers a Job
        # immediately rather than only updating the template, and a full pass
        # over the six libraries takes ~2h20m. With concurrencyPolicy Forbid, a
        # change to kometa-configmap or kometa-secret landing within ~2h of
        # midnight leaves that run in flight when @daily fires, and the
        # scheduled run is skipped with no error. Each pod reads the ConfigMap
        # at creation, so the next run picks up config changes regardless.
        # To apply one immediately, ask for it explicitly:
        #   kubectl -n entertainment create job --from=cronjob/kometa \
        #     kometa-manual-$(date +%s)
        cronjob:
          schedule: "@daily"
          timeZone: &timeZone ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: kometateam/kometa
              tag: v2.5.3@sha256:48c3cb318ec984213587f221e8e762c5ad2dbd0e6966efc7bba0a5868a6c5758
            command:
              - /bin/sh
              - -c
            args:
              - |
                python3 kometa.py --run --read-only-config --run-libraries "Anime";
                python3 kometa.py --run --read-only-config --run-libraries "Movies";
                python3 kometa.py --run --read-only-config --run-libraries "Movies - UHD";
                python3 kometa.py --run --read-only-config --run-libraries "TV Shows";
                python3 kometa.py --run --read-only-config --run-libraries "TV Shows - Foreign";
                python3 kometa.py --run --read-only-config --run-libraries "TV Shows - UHD";
            env:
              TZ: *timeZone
            envFrom:
              - secretRef:
                  name: kometa-secret
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: *app
      config-file:
        type: configMap
        name: kometa-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      # No logs volume on purpose: /config/logs falls through to the config
      # PVC above, so each run's per-library log survives the pod exiting.
      # An emptyDir here destroys them, hiding what the nightly run changed.
      # Kometa's cache is SQLite (/config/config.cache) and it builds
      # tmdb_episode_data2_episode_id_language with CREATE UNIQUE INDEX. A
      # sort that outgrows SQLite's page cache spills to the temp dir, and
      # with readOnlyRootFilesystem and no /tmp that fails as errcode 6410.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
