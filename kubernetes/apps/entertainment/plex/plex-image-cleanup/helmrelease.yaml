---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex-image-cleanup
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      plex-image-cleanup:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          schedule: "30 8 * * *"
          successfulJobsHistory: 1
        containers:
          app:
            image:
              repository: docker.io/meisnate12/plex-image-cleanup
              tag: v1.0.2
            env:
              PLEX_URL: http://plex.entertainment.svc.cluster.local:32400
              PLEX_PATH: /data/plex_config/Library/Application Support/Plex Media Server
              MODE: remove
              PHOTO_TRANSCODER: true
            envFrom:
              - secretRef:
                  name: plex-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                cpu: 25m
                # Set explicitly: with only a memory limit, Kubernetes sets the
                # request equal to it, reserving far more than this job needs.
                memory: 64Mi
              limits:
                # Was 128Mi, which OOMKilled 1-3 pods every night for at least
                # 14 consecutive nights (10-05 to 10-19). The Job still reported
                # Complete because a retry eventually fit, so it went unnoticed
                # while tripping the cluster-wide OOMKilled alert daily.
                #
                # Not sized from Prometheus on purpose: peak working set reads
                # 54-63MiB, which is misleading. The run lasts ~104s, so a pod
                # that OOMs dies between scrapes and never gets sampled -- those
                # figures come from the runs that survived. 1Gi is margin over a
                # spike we cannot measure, and costs nothing while idle since
                # the pod only exists for a couple of minutes a night.
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["plex"]
              topologyKey: kubernetes.io/hostname
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      plex-config:
        existingClaim: plex
        globalMounts:
          - path: /data/plex_config
      plex-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /data/plex_config/Library/Application Support/Plex Media Server/Cache
