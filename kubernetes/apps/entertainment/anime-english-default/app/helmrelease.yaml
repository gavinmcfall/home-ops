---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anime-english-default
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      anime-english-default:
        type: cronjob
        cronjob:
          # Nightly. Makes English audio the default track in anime MKVs with
          # a header-only mkvpropedit edit. Tdarr transcodes around the clock,
          # so the script asks Tdarr which files are in flight and skips them,
          # and skips anything modified in the last hour.
          schedule: "30 4 * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        containers:
          app:
            # Same image and digest as tdarr: it already ships mkvtoolnix and
            # python3, and is cached on the nodes. Bump together with tdarr.
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 2.50.01@sha256:67d6a456d3c7963d2bc50318275843015af76e1f4dced3b1c5a91f8874d230bf
            command: ["python3", "/scripts/english_default.py"]
            env:
              ROOT: /media/Library/Anime
              # "true" edits files; anything else only logs what would change.
              APPLY: "false"
              # apply = with English audio default, an English signs & songs
              # track is the only default sub (or none); full subs go off.
              # Gavin's call, 2026-11-28. report = log only, off = ignore.
              SUBS: apply
              MIN_AGE_MINUTES: "60"
              LIMIT: "0"
              TDARR_URL: http://tdarr.entertainment.svc.cluster.local:8266
              HOME: /tmp
            # Supplies apiKey for the Tdarr API.
            envFrom:
              - secretRef:
                  name: tdarr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              # mkvmerge -J needs ~80 MB on most files but 1.2 GB on some
              # remuxes (Shangri-La Frontier S02E09). The script caps each
              # mkvmerge at 2.5 GiB, so this limit sits just above that.
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        supplementalGroups: [10000]
        seccompProfile: {type: RuntimeDefault}
    persistence:
      scripts:
        type: configMap
        name: anime-english-default-configmap
        defaultMode: 0775
        globalMounts:
          - path: /scripts
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      media:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        globalMounts:
          - path: /media
