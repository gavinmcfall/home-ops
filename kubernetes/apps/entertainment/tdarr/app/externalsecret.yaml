---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tdarr-secret
    template:
      engineVersion: v2
      data:
        # Tdarr's env var is literally lowercase-camel `apiKey`.
        # With auth enabled EVERY node needs this to register, including the
        # internal node in this same container. Without it the node loops on
        # "is trying to register but failed auth" every 2s and nothing ever
        # transcodes - while the server and its UI still look perfectly healthy.
        apiKey: "{{ .TDARR_API_KEY }}"
  dataFrom:
    - extract:
        key: tdarr
