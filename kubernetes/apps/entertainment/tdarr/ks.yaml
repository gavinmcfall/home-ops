---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tdarr
  namespace: &namespace entertainment
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/entertainment/tdarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # /app/server holds the Tdarr DB, plugin stacks and generated samples.
      # VolSync PVCs are create-once (ssa: IfNotPresent), so a later capacity
      # bump in git will NOT resize the live PVC - size it correctly now.
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_MINUTE: "6"
      VOLSYNC_B2_MINUTE: "6"
      VOLSYNC_STORAGECLASS: ceph-block
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-block
      VOLSYNC_ACCESSMODES: ReadWriteOnce
