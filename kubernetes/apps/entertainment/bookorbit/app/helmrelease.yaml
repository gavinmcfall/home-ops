---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # Nightly library scan trigger. Upstream bookorbit#985: the in-app
      # autoScanCronExpression is stored/validated but never scheduled, and the
      # file watcher cannot see NFS changes — so new acquisitions only appear
      # via an API-triggered scan. Remove this controller once #985 lands
      # (tracked in nerdz-reading docs/upstream-tracker.md).
      # Script style: bare $VAR only, no dollar-brace tokens anywhere (Flux
      # post-build envsubst processes this manifest; braces fail the build).
      scan-nightly:
        type: cronjob
        cronjob:
          suspend: false
          schedule: "0 4 * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 1
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
            command:
              - /bin/sh
              - -c
              - |
                set -e
                BO=http://bookorbit.entertainment.svc.cluster.local:3000
                TOKEN=$(curl -sf -X POST "$BO/api/v1/auth/login" -H 'content-type: application/json' -d "{\"username\":\"$BOOKORBIT_ADMIN_USER\",\"password\":\"$BOOKORBIT_ADMIN_PASSWORD\"}" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
                if [ -z "$TOKEN" ]; then echo "scan-nightly: login failed" >&2; exit 1; fi
                CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BO/api/v1/scanner/libraries/1/scan" -H "Authorization: Bearer $TOKEN")
                echo "scan-nightly: scan trigger returned HTTP $CODE"
                case "$CODE" in 202) exit 0;; 409) echo "scan-nightly: scan already running - fine"; exit 0;; *) exit 1;; esac
            env:
              TZ: ${TIMEZONE}
              BOOKORBIT_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: BOOKORBIT_ADMIN_USER
              BOOKORBIT_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: BOOKORBIT_ADMIN_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: bookorbit-secret
        containers:
          app:
            # BookOrbit TRIAL as the family reading hub: library + web readers,
            # OPDS server, KOSync endpoints, KOReader/Kobo sync, annotations hub,
            # Hardcover/StoryGraph sync. The library is mounted READ-ONLY while
            # the CWA-vs-BookOrbit metadata-in-file question is decided — its
            # scanner works, but nothing can bake metadata into the files yet.
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 2.5.0@sha256:e131834be597819000e44d580cbe16c168895a6334315ba4101963c028c29b0e
            env:
              TZ: ${TIMEZONE}
              NODE_ENV: production
              PORT: &port 3000
              # Family-facing hostname (deliberately not the app name); APP_URL
              # drives OIDC callback, Kobo endpoints, and email links.
              APP_URL: https://read.${SECRET_DOMAIN}
              # Run as the cluster-standard app UID; ownership is managed by the
              # NFS exports and fsGroup, not by the container entrypoint.
              PUID: "568"
              PGID: "568"
              BOOKORBIT_FIX_PERMISSIONS: "false"
              # Scope the in-app library folder picker to the mounted library
              LIBRARY_BROWSE_ROOT: /books
              # pocket-id's issuer resolves to the internal gateway LB (private
              # IP) from inside the cluster; without this the OIDC discovery
              # SSRF guard refuses it.
              OIDC_ALLOW_LOCAL_ISSUERS: "true"
              NODE_MAX_OLD_SPACE_SIZE: "3072"
            envFrom:
              - secretRef:
                  name: bookorbit-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: bookorbit
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames:
          - read.${SECRET_DOMAIN}
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
    persistence:
      # advancedMounts (not global): the scan-nightly CronJob pod must get NO
      # mounts — the data PVC is RWO (multi-attach risk) and the tree is not
      # its business; it only speaks HTTP to the service.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        advancedMounts:
          bookorbit:
            app:
              - path: /data
      # Same single NFS export as audiobookshelf/CWA, sub-pathed to the family
      # genre-tree library. READ-ONLY for the trial: BookOrbit's file-write
      # pipeline (metadata baking, renames) stays inert until the
      # CWA-vs-BookOrbit metadata-management decision is made.
      books:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        advancedMounts:
          bookorbit:
            app:
              - path: /books
                subPath: Library/Books
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          bookorbit:
            app:
              - path: /tmp
