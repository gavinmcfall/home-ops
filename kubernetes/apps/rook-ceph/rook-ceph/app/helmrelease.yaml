---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # From Rook 1.20 this chart only installs the ceph-csi-operator. The drivers and
    # their settings live in ./csi-drivers-helmrelease.yaml; the CephFS kernel mount
    # option lives on the CephCluster (../cluster/helmrelease.yaml).
    csi:
      # Rook keeps the CephConnection and ClientProfile (mon addresses, mount options)
      # up to date for the drivers. The 1.21.2 chart renders this setting empty when
      # it is not given, which only means "true" by accident of how the operator loads
      # an empty value, so say it.
      createCsiOperatorResources: true
      serviceMonitor:
        enabled: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
