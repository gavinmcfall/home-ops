---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ebook-reconcile
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      # Nightly incremental bake: embed Calibre DB metadata into the library
      # files (calibredb embed_metadata) for books modified in the last 2 days.
      # Mounts ONLY the Calibre library (advancedMounts). That mount is now
      # REAL isolation — see the note below.
      embed-nightly:
        type: cronjob
        cronjob:
          # Suspended 2026-08-17 because mount isolation did not survive
          # hardlinks: calibredb embed_metadata writes IN PLACE, straight through
          # the tree<->calibre hardlink (368 pairs), silently rewriting genre-tree
          # files. Worse, a tree file can itself be hardlinked to a SEEDING
          # torrent (Bindery organises grabs by hardlink, never move), so a bake
          # could rewrite bytes qBittorrent is serving — hit-and-run.
          #
          # UNSUSPENDED 2026-08-18: the design decision was taken — break the
          # links. All 368 Calibre<->tree hardlinks were replaced with Calibre-
          # owned copies (verified: 0 files at nlink>=3 anywhere), reconcile.py
          # now COPIES instead of linking, and bulk_import.py's hardlink dedup
          # was removed. The tree file's only hardlink partner is now the torrent,
          # so this job genuinely cannot reach the genre tree.
          suspend: false
          schedule: "30 3 * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 1
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/crocodilestick/calibre-web-automated
              tag: v4.0.6@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
            command: ["/bin/bash", "/scripts/embed_nightly.sh"]
            env:
              TZ: ${TIMEZONE}
              HOME: /tmp
              CALIBRE_CONFIG_DIRECTORY: /tmp/calibre
              CALIBREDB: /app/calibre/calibredb
              LIB: /calibre-library
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
      ebook-reconcile:
        type: cronjob
        cronjob:
          # SUSPENDED until the controlled first run is validated.
          suspend: true
          schedule: "*/15 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 1
        pod:
          # calibredb is a plain binary here (command override, no s6 init) → run rootless,
          # UID 568 to match the NFS file ownership the CWA workbench writes.
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/crocodilestick/calibre-web-automated
              tag: v4.0.6@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
            command: ["python3", "/scripts/reconcile.py"]
            env:
              TZ: ${TIMEZONE}
              HOME: /tmp
              CALIBRE_CONFIG_DIRECTORY: /tmp/calibre
              # /usr/bin/calibredb is an s6-created runtime symlink; command-override skips s6
              CALIBREDB: /app/calibre/calibredb
              LIB: /media/Library/Books/.calibre/library       # staging Calibre library (CWA workbench)
              DEST: /media/Library/Books/Books                 # AudiobookShelf books root
              STATE: /state/abs_paths.json
              # Selector for "belongs in the tree". A custom column, not a tag: `tags`
              # is embedded into the epub's dc:subject and BookOrbit reads that as a
              # genre, so a tag marker leaks into the UI as a browsable genre.
              # `:yes` not `:true` -- for a bool custom column Calibre reads
              # `:true` as "has any value", so it also selects books set to False.
              SELECT: "#tosync:yes"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      scripts:
        type: configMap
        name: ebook-reconcile-scripts
        defaultMode: 0555
        globalMounts:
          - path: /scripts
      # Single NFS mount so LIB (library) and DEST (Books) share one device → hardlinks work.
      # advancedMounts: reconcile needs the whole export (library + tree);
      # embed-nightly gets ONLY the Calibre library subpath — tree unreachable.
      media:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        advancedMounts:
          ebook-reconcile:
            app:
              - path: /media
          embed-nightly:
            app:
              - path: /calibre-library
                subPath: Library/Books/.calibre/library
      state:
        accessMode: ReadWriteOnce
        size: 128Mi
        storageClass: ceph-block
        advancedMounts:
          ebook-reconcile:
            app:
              - path: /state
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
