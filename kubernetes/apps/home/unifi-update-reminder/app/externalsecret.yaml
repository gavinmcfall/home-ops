---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-update-reminder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
  target:
    name: unifi-update-reminder-secret
    template:
      engineVersion: v2
      data:
        MAIL_TO: "{{ .UNIFI_REMINDER_EMAIL_TO }}"
  dataFrom:
    - extract:
        key: unifi-update-reminder
