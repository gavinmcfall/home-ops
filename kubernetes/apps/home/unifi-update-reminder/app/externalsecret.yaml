---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-update-reminder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-update-reminder-secret
    template:
      engineVersion: v2
      data:
        # Same channel as non-critical Alertmanager notifications, with an
        # @mention so it pings.
        DISCORD_WEBHOOK: "{{ .DISCORD_WEBHOOK_CLUSTER }}"
        DISCORD_USER_ID: "{{ .DISCORD_PRIMARY_ALERT_USER }}"
  dataFrom:
    - extract:
        key: discord
