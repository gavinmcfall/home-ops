---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-gpt-secret
    template:
      engineVersion: v2
      data:
        # The OpenAI key, read by name from the paperless-gpt item (see data:
        # below). Both the paperless and paperless-gpt items have a field called
        # PAPERLESS_OPENAI_API_KEY; through dataFrom the paperless item's old
        # LiteLLM virtual key won.
        OPENAI_API_KEY: "{{ .PAPERLESS_GPT_OPENAI_API_KEY }}"
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_TOKEN }}" #Generated here: https://paperless.{SECRET_DOMAIN}/config
        GOOGLE_PROJECT_ID: "{{ .GOOGLE_PROJECT_ID }}"
        GOOGLE_LOCATION: "{{ .GOOGLE_LOCATION_ID }}"
        GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gdocai-credentials.json"
        GOOGLE_PROCESSOR_ID: "{{ .GOOGLE_PROCESSOR_ID }}"
        #Secret file
        gdocai-credentials.json: |
          {
            "type": "service_account",
            "project_id": "{{ .GOOGLE_PROJECT_ID }}",
            "private_key_id": "{{ .GOOGLE_PRIVATE_KEY_ID }}",
            "private_key": "{{ .GOOGLE_PRIVATE_KEY }}",
            "client_email": "{{ .GOOGLE_CLIENT_EMAIL }}",
            "client_id": "{{ .GOOGLE_CLIENT_ID }}",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "{{ .GOOGLE_CLIENT_CERT_URL }}",
            "universe_domain": "googleapis.com"
          }
  data:
    - secretKey: PAPERLESS_GPT_OPENAI_API_KEY
      remoteRef:
        key: paperless-gpt
        property: PAPERLESS_OPENAI_API_KEY
  dataFrom:
    - extract:
        key: paperless
    - extract:
        key: paperless-gpt
