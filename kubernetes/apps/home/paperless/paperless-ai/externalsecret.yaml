---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-ai-secret
    template:
      engineVersion: v2
      data:
        # The AI provider (OpenAI) and its key are set in the web UI and stored
        # in data/config.json. Environment variables would lock those settings.
        API_KEY: "{{ .PAPERLESS_API_TOKEN }}" # Generated here: https://paperless.{SECRET_DOMAIN}/config
  dataFrom:
    - extract:
        key: paperless-ai
    - extract:
        key: paperless
