# state_dir holds the outbound queue, so it MUST be persistent: a pod restart
# on ephemeral storage silently destroys undelivered mail (this ate ~188 queued
# messages on 2026-08-18). runtime_dir is sockets/pidfiles only and is
# deliberately left on the emptyDir so nothing stale survives a restart.
state_dir /queue
runtime_dir /cache/run

openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

tls off
hostname {env:HOSTNAME}

smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
    # Migadu is the ceiling on this path, not Amazon. smtp.migadu.com
    # advertises "250 SIZE 29360128" (28 MiB) on EHLO -- measured 2026-11-04.
    # An earlier comment here claimed it advertised 52428800 and set the cap
    # to 50M on that basis; the figure was wrong, and the consequence is
    # silent: anything between 28 and 50 MiB is accepted here with a 250, then
    # permanently refused upstream with 552, which maddy rewrites to a
    # temporary 452 per RFC 5321 4.5.3.1.10 and so retries instead of
    # bouncing. That is how 8 BookOrbit send-to-Kindle books (36-48 MiB)
    # wedged the queue on 2026-11-03/04 and raised SmtpRelayQueueStuck.
    # 27M (28,311,552) sits under Migadu's limit with room for the Received
    # header maddy adds, so anything accepted here can actually be delivered,
    # and anything larger is refused at DATA time where the sender sees it.
    # Note the base64 tax: an epub grows by a third in transit, so the real
    # book-size ceiling on this path is ~21 MB, well under Amazon's own 50 MB.
    max_message_size 27M
    default_source {
        deliver_to &remote_queue
    }
}

target.queue remote_queue {
    target &remote_smtp

    # NO bounce BLOCK, ON PURPOSE. One was added on 2026-11-05 and removed the
    # same day once tested: it cannot work with this upstream, and leaving it
    # in would look like protection that isn't there.
    #
    # maddy always sends DSNs with the null return-path --
    # internal/target/queue/queue.go has "// Null return-path, used in DSNs."
    # immediately above StartDelivery(mailCtx, dsnMeta, "") -- and Migadu's
    # authenticated submission answers MAIL FROM:<> with
    # "550 5.7.1 sender address rejected: not allowed". Measured against the
    # account the same day: <> -> 550, maddy@nerdz.cloud -> 250,
    # MAILER-DAEMON@nerdz.cloud -> 250. autogenerated_msg_domain sets only the
    # DSN's visible From header, so it cannot fix this, and maddy has no
    # dsn_sender directive. Proven end-to-end with a deliberate permanent
    # failure: "generated failed DSN" followed by
    # "failed to enqueue DSN ... SMTP error 550: sender address rejected".
    #
    # What covers the gap instead:
    #   - oversize mail is refused at submission by max_message_size above, so
    #     the sender is told synchronously and nothing is swallowed. Note maddy
    #     logs NOTHING for that refusal -- it goes out on the wire only -- so
    #     the sending app is the only place an oversize failure can be seen.
    #   - bad recipients already bounce from Migadu itself back to the original
    #     sender; it accepts every RCPT (even a reserved .invalid domain) and
    #     bounces asynchronously, so maddy never saw those failures anyway.
    #   - anything that still fails permanently here raises the
    #     SmtpRelayPermanentFailure alert in ./resources/lokirule.yaml, keyed on
    #     maddy's "not delivered, permanent error" log line. That log line is
    #     the only signal available: maddy publishes three metrics and none of
    #     them counts a delivery failure.
}

target.smtp remote_smtp {
    auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
    targets tls://{env:SMTP_RELAY_SERVER}:465
    starttls no
}
