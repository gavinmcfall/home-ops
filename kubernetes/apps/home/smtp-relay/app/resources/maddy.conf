# state_dir holds the outbound queue, so it MUST be persistent: a pod restart
# on ephemeral storage silently destroys undelivered mail (this ate ~188 queued
# messages on 2026-08-18). runtime_dir is sockets/pidfiles only and is
# deliberately left on the emptyDir so nothing stale survives a restart.
state_dir /queue
runtime_dir /cache/run

openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

tls off
hostname {env:HOSTNAME}

smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
    # Migadu is the ceiling on this path, not Amazon. smtp.migadu.com
    # advertises "250 SIZE 29360128" (28 MiB) on EHLO -- measured 2026-11-04.
    # An earlier comment here claimed it advertised 52428800 and set the cap
    # to 50M on that basis; the figure was wrong, and the consequence is
    # silent: anything between 28 and 50 MiB is accepted here with a 250, then
    # permanently refused upstream with 552, which maddy rewrites to a
    # temporary 452 per RFC 5321 4.5.3.1.10 and so retries instead of
    # bouncing. That is how 8 BookOrbit send-to-Kindle books (36-48 MiB)
    # wedged the queue on 2026-11-03/04 and raised SmtpRelayQueueStuck.
    # 27M (28,311,552) sits under Migadu's limit with room for the Received
    # header maddy adds, so anything accepted here can actually be delivered,
    # and anything larger is refused at DATA time where the sender sees it.
    # Note the base64 tax: an epub grows by a third in transit, so the real
    # book-size ceiling on this path is ~21 MB, well under Amazon's own 50 MB.
    max_message_size 27M
    default_source {
        deliver_to &remote_queue
    }
}

target.queue remote_queue {
    target &remote_smtp

    # Without a bounce block maddy generates no DSN at all: a message that
    # fails permanently upstream is retried max_tries (20) times and then
    # dropped in silence, leaving the sender believing the 250 it got at
    # submission. The 8 books lost in Nov 2026 died exactly that way, and the
    # only reason anyone noticed was the queue-depth alert. DSNs go back out
    # through the same upstream, so autogenerated_msg_domain has to be a
    # domain Migadu lets this account send as -- SMTP_RELAY_HOSTNAME is
    # nerdz.cloud, the same domain as the authenticated username.
    autogenerated_msg_domain {env:SMTP_RELAY_HOSTNAME}
    bounce {
        default_destination {
            deliver_to &remote_smtp
        }
    }
}

target.smtp remote_smtp {
    auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
    targets tls://{env:SMTP_RELAY_SERVER}:465
    starttls no
}
