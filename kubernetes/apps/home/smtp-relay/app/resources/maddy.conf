# state_dir holds the outbound queue, so it MUST be persistent: a pod restart
# on ephemeral storage silently destroys undelivered mail (this ate ~188 queued
# messages on 2026-08-18). runtime_dir is sockets/pidfiles only and is
# deliberately left on the emptyDir so nothing stale survives a restart.
state_dir /queue
runtime_dir /cache/run

openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

tls off
hostname {env:HOSTNAME}

smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
    # maddy's default is 32M, and a send-to-Kindle epub grows by a third in
    # base64: a 28.6 MB book (The First Unicorn Rider, 2026-09-16) arrived as
    # ~39 MB, was refused here with "552 Maximum message size exceeded", and
    # BookOrbit showed the sender only "554 5.0.0 Internal server error" --
    # three times over three days. 50M matches both ends of the path: the
    # upstream advertises SIZE 52428800 on EHLO and Amazon's Send-to-Kindle
    # cap is 50 MB, so nothing this accepts can be refused further along.
    max_message_size 50M
    default_source {
        deliver_to &remote_queue
    }
}

target.queue remote_queue {
    target &remote_smtp
}

target.smtp remote_smtp {
    auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
    targets tls://{env:SMTP_RELAY_SERVER}:465
    starttls no
}
