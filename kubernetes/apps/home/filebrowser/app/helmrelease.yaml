---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      filebrowser:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 2.0.2-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
            env:
              TZ: ${TIMEZONE}
              # FILEBROWSER_DATABASE (v1) is deliberately gone: in v2 its mere
              # presence is a startup Fatal unless server.database.migrateFrom is
              # the literal string "default". The migration path is declared
              # explicitly in config.yaml instead -- see externalsecret.yaml.
              FILEBROWSER_CONFIG: /config/config.yaml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: filebrowser
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: filebrowser
        globalMounts:
          - path: /config
      config-file:
        type: secret
        name: filebrowser-secret
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      media:
        type: nfs
        server: citadel.internal
        path: /mnt/storage0/media
        globalMounts:
          - path: /folder
      tmp:
        type: emptyDir
        # v1 held its file index in memory, which is what the 3Gi limit above is
        # for. v2 persists it to SQLite at <cacheDir>/sql/index_<source>.db, and
        # cacheDir is /tmp/cache -- so this emptyDir, previously pure scratch,
        # now carries real data on node ephemeral storage. The media source is
        # ~490k entries (440,459 files + 49,933 dirs), a few hundred MB of index;
        # the remaining headroom is for previews and the download spool, which v2
        # bounds at maxArchiveSize (default 20GB). The limit means a runaway cache
        # costs one pod eviction rather than filling a node's disk (~800GB
        # allocatable) and taking unrelated workloads down with it.
        sizeLimit: 24Gi
        globalMounts:
          - path: /tmp
