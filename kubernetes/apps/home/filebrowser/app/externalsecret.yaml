---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: filebrowser-secret
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            cacheDir: /tmp/cache
            sources:
              - path: /folder
                name: Media
            # v2 replaced the single BoltDB file with SQLite. `migrateFrom` points
            # at the v1 BoltDB and imports it on first start, but only while
            # `path` is absent or empty -- once SQLite is populated the import is
            # skipped, so this is idempotent across restarts.
            #
            # `path` MUST be set here and not left to the image, which ships
            # FILEBROWSER_DATABASE_PATH=/home/filebrowser/data/database.sqlite --
            # a location on the read-only root filesystem. Config wins over env:
            # SetDefaults() seeds Path from that var, then this YAML is decoded
            # over it. It also must not be named database.db, which v2 reserves
            # for the legacy file and rejects outright.
            #
            # Leaving migrateFrom set afterwards is safe, and is what makes a
            # restore of this PVC re-migrate. But v2 hard-fails when migrateFrom
            # names a missing or empty file, so database.db must stay put for as
            # long as this line does.
            database:
              path: /config/filebrowser.sqlite
              migrateFrom: /config/database.db
          # New top-level section in v2 -- every HTTP key moved out of `server`.
          # Needed because this app is on the external gateway behind Envoy:
          # without it filebrowser reads the proxy's own address and sees scheme
          # http (TLS terminates at the gateway), so generated share links come
          # out as http:// and v2's new per-IP auth rate limiting keys every
          # visitor into one bucket. Safe to trust here: v2 reads the RIGHTMOST
          # X-Forwarded-For hop, the one the trusted proxy appended, rather than
          # the client-controlled leftmost value.
          http:
            trustProxyHeaders: true
          auth:
            methods:
              password:
                enabled: false
              oidc:
                enabled: true
                clientId: "{{ .FILEBROWSER_OIDC_CLIENT_ID }}"
                clientSecret: "{{ .FILEBROWSER_OIDC_CLIENT_SECRET }}"
                issuerUrl: https://id.${SECRET_DOMAIN}
                scopes: openid email profile groups
                userIdentifier: preferred_username
                createUser: true
                adminGroup: nerdz_admins
  dataFrom:
    - extract:
        key: filebrowser
