---
# Password for the `immich` role, from the same 1Password item the app uses.
#
# CNPG re-applies the initdb owner's password from a secret every time the
# primary starts (and whenever that secret changes). Without `initdb.secret`
# it generates its own `postgres18-immich-app` secret with a random password,
# which overwrites the 1Password one on every primary start until Immich's
# init-db container next runs. BookOrbit broke exactly this way on 2026-11-13
# (see ../postgres18-bookorbit/externalsecret.yaml); Immich only escaped
# through restart timing. Pointing CNPG at this secret leaves one source of
# truth.
#
# 1Password item `immich` must provide: IMMICH_POSTGRES_PASS.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-pg-role
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-pg-role
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG applies a changed password straight away instead of waiting
          # for the next instance restart.
          cnpg.io/reload: "true"
      data:
        # A literal, not the 1Password field: CNPG refuses a secret whose
        # username differs from bootstrap.initdb.owner.
        username: immich
        password: "{{ .IMMICH_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: immich
