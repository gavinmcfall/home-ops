---
# Password for the `bookorbit` role, from the same 1Password item the app uses.
#
# CNPG re-applies the initdb owner's password from a secret every time the
# primary starts (and whenever that secret changes). Without `initdb.secret`
# it generates its own `postgres18-bookorbit-app` secret with a random
# password, which silently overwrote the 1Password one on every database
# restart: BookOrbit then crash-looped with `password authentication failed
# for user "bookorbit"` until its pod (and init-db container) ran again
# (2026-11-13). Pointing CNPG at this secret leaves one source of truth.
#
# 1Password item `bookorbit` must provide: BOOKORBIT_POSTGRES_PASS.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-pg-role
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookorbit-pg-role
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG applies a changed password straight away instead of waiting
          # for the next instance restart.
          cnpg.io/reload: "true"
      data:
        # A literal, not the 1Password field: CNPG refuses a secret whose
        # username differs from bootstrap.initdb.owner.
        username: bookorbit
        password: "{{ .BOOKORBIT_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: bookorbit
