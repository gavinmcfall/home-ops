---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18-bookorbit
  namespace: database
spec:
  # TRIAL POSTURE: single instance, no pgBackRest. BookOrbit is being evaluated
  # as the reading hub; its DB holds re-derivable scan metadata plus early user
  # state. Before promoting to production: bump instances to 3 and wire the
  # pgbackrest plugin + stanza/pluginconfig/scheduledbackups (mirror
  # postgres18-immich).
  instances: 1

  # Skip the long "smart" stop that never completes while clients hold
  # connections, so the instance reaches a clean fast stop inside the kubelet's
  # 20s node-shutdown budget (see postgres18-cluster for the 2026-11-13 detail).
  smartShutdownTimeout: 5
  # BookOrbit requires the uuid-ossp, pg_trgm, and vector (pgvector) extensions.
  # The vectorchord image ships vector 0.8.1 + contrib (verified against the
  # running postgres18-immich cluster); same pinned image as postgres18-immich.
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord versioning=loose enabled=false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
  primaryUpdateStrategy: unsupervised

  storage:
    size: 10Gi
    storageClass: openebs-hostpath

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB

  resources:
    requests:
      cpu: 100m
    limits:
      memory: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      # One source of truth for the owner's password; see externalsecret.yaml.
      # Without this CNPG generates its own and re-applies it on every restart.
      secret:
        name: bookorbit-pg-role
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp" CASCADE
        - CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE
