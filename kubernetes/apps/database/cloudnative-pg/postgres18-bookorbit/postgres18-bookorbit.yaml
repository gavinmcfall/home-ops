---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18-bookorbit
  namespace: database
spec:
  # One primary and two replicas, one per node (2026-11-16; a single instance
  # before that, as a trial). Mirrors postgres18-immich. With replicas the
  # default PodDisruptionBudget is back: a node drain now switches the primary
  # to a replica instead of having nowhere to go.
  instances: 3
  # Promote an updated replica instead of restarting the primary in place.
  # With switchover, an image change and a postgresql.parameters change must
  # be separate commits.
  primaryUpdateMethod: switchover

  # Tolerate brief pod-network blips before failing over (see postgres18-cluster
  # for the 2026-06-16 incident).
  failoverDelay: 30
  probes:
    liveness:
      isolationCheck:
        enabled: true
        connectionTimeout: 3000
        requestTimeout: 3000

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  # Skip the long "smart" stop that never completes while clients hold
  # connections, so the instance reaches a clean fast stop inside the kubelet's
  # 20s node-shutdown budget (see postgres18-cluster for the 2026-11-13 detail).
  smartShutdownTimeout: 5
  # BookOrbit requires the uuid-ossp, pg_trgm, and vector (pgvector) extensions.
  # The vectorchord image ships vector 0.8.1 + contrib (verified against the
  # running postgres18-immich cluster); same pinned image as postgres18-immich.
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord versioning=loose enabled=false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
  primaryUpdateStrategy: unsupervised

  storage:
    size: 10Gi
    storageClass: openebs-hostpath

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB

  resources:
    requests:
      cpu: 100m
    limits:
      memory: 2Gi

  monitoring:
    enablePodMonitor: true

  # pgBackRest plugin: WAL archiving + backups to Backblaze B2
  plugins:
    - name: pgbackrest.dalibo.com
      enabled: true
      isWALArchiver: true
      parameters:
        stanzaRef: postgres18-bookorbit-stanza
        pluginConfigRef: postgres18-bookorbit-pluginconfig

  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      # One source of truth for the owner's password; see externalsecret.yaml.
      # Without this CNPG generates its own and re-applies it on every restart.
      secret:
        name: bookorbit-pg-role
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp" CASCADE
        - CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE
