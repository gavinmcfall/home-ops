---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18-cluster
  namespace: database
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  primaryUpdateStrategy: unsupervised
  # Promote an updated replica instead of restarting the primary in place: the 18.6
  # roll on 2026-11-13 took the shared primary down for ~2 min with the default (restart).
  # With switchover, an image change and a postgresql.parameters change must be separate commits.
  primaryUpdateMethod: switchover

  # Tolerate brief pod-network blips before failing over. On 2026-06-16 a ~45s
  # stanton-02 network disruption tripped the default 1s isolation check and
  # fenced the primary, cascading restarts across every DB-dependent app.
  # Loosen the trigger so short stalls don't cause a failover; genuine outages
  # (sustained past failoverDelay) still promote a replica.
  failoverDelay: 30

  # On shutdown CNPG first tries a "smart" stop: refuse new connections and
  # wait for existing ones to leave. Apps and poolers hold connections open, so
  # that never completes and the full timeout (default 180s) is pure outage:
  # - a deleted primary sat 3 minutes before failover even began (2026-11-13,
  #   about 5 minutes without writes);
  # - on a node reboot the kubelet only grants 20s (shutdownGracePeriod 30s
  #   minus 10s for critical pods), so the primary was SIGKILLed mid-smart-stop
  #   and came back through crash recovery.
  # 5s leaves room for a clean "fast" stop (checkpoint, close connections)
  # inside that 20s.
  smartShutdownTimeout: 5
  probes:
    liveness:
      isolationCheck:
        enabled: true          # keep split-brain protection
        connectionTimeout: 3000  # was 1000ms default
        requestTimeout: 3000     # was 1000ms default

  storage:
    size: 20Gi
    storageClass: openebs-hostpath

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      wal_keep_size: 2GB

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  resources:
    requests:
      cpu: 100m
      memory: 5Gi
    limits:
      memory: 14Gi

  monitoring:
    enablePodMonitor: true

  # pgBackRest Plugin for backups (B2 + R2 dual destination)
  plugins:
    - name: pgbackrest.dalibo.com
      enabled: true
      isWALArchiver: true
      parameters:
        stanzaRef: postgres18-cluster-stanza
        pluginConfigRef: postgres18-cluster-pluginconfig

  # Managed roles. `mempalace` owns the mempalace pgvector database
  # (see mempalace-db.yaml). Password sourced from the mempalace-pg-role secret.
  # `affine` owns the affine pgvector database (see affine-db.yaml).
  managed:
    roles:
      - name: mempalace
        ensure: present
        login: true
        passwordSecret:
          name: mempalace-pg-role
      - name: affine
        ensure: present
        login: true
        passwordSecret:
          name: affine-pg-role

  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      # The initdb owner here is the `postgres` superuser. Without a named
      # secret CNPG generated `postgres18-cluster-app` (username postgres,
      # random password) and, on every primary start, applied the superuser
      # password and then THAT one on top of it. Every app's init-db container
      # then failed to log in as postgres until the 15-minute refresh of
      # cloudnative-pg-secret re-applied the real password (1,764 failed
      # logins from 15 pods after the 2026-11-13 stanton-01 reboot; the likely
      # cause of the 2026-10-18 "superuser drift" too). Naming the superuser
      # secret here makes both passes use the same password.
      secret:
        name: cloudnative-pg-secret

  # ============================================================================
  # RESTORE FROM BACKUP (commented out - use instead of initdb above)
  # ============================================================================
  # To restore from backup:
  # 1. Comment out the 'initdb' block above
  # 2. Uncomment the 'recovery' block and 'externalClusters' below
  # 3. Optionally add recoveryTarget for point-in-time recovery
  # ============================================================================
  # bootstrap:
  #   recovery:
  #     source: pgbackrest-backup
  #     # Optional: Point-in-time recovery
  #     # recoveryTarget:
  #     #   targetTime: "2025-01-15 10:30:00"  # Restore to specific time
  #     #   # OR use: targetLSN, targetXID, targetImmediate
  #
  # externalClusters:
  #   - name: pgbackrest-backup
  #     plugin:
  #       name: pgbackrest.dalibo.com
  #       parameters:
  #         repositoryRef: postgres18-cluster-repository
  #         # Optional: Select which repo to restore from (1=B2, 2=R2)
  #         # selectedRepository: "1"
