---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
spec:
  # CNPG re-applies the `postgres` superuser password to the database ONLY when
  # the resourceVersion of `cloudnative-pg-secret` changes. The chain is:
  # the operator watches secrets labelled `cnpg.io/reload`
  # (internal/controller/cluster_predicates.go) -> stamps the version into the
  # Cluster status -> each instance manager compares it against an in-memory,
  # per-pod map before issuing ALTER ROLE. No resourceVersion change means the
  # database is never reconciled, so once it drifts it stays drifted.
  #
  # The `last-synced` annotation below is what manufactures that change, and
  # this interval is how often it fires — i.e. the worst-case drift window and
  # the auto-repair period. 15m rather than 1h because each refresh is also a
  # repair attempt; cnpg-superuser-probe then pages only when auto-repair is
  # itself failing.
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudnative-pg-secret
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          # MUST stay second-granular. ESO's skip check hashes only `.data`
          # (isSecretValid -> ObjectHash(secret.Data)), so this annotation can
          # never *force* a refresh — it only changes the rendered output. An
          # hour-granular timestamp therefore renders byte-identical on every
          # refresh that lands in the same clock hour, the API server dedupes
          # the write, and no resourceVersion bump happens at all.
          #
          # Observed directly on the previous `"2006-01-02T15"` layout during
          # the 2026-10-18 incident: a Flux force-sync made ESO do a full
          # re-render (status.refreshTime advanced to 20:40:45Z) and write
          # nothing at all — ESO's managedFields entry stayed at 20:10:47Z and
          # the "secret updated" event stayed at last=20:10:47Z. The documented
          # emergency repair step was therefore a no-op, and recovery needed an
          # out-of-band `kubectl annotate secret cnpg.io/force-reconcile=...`
          # (not a CNPG annotation at all — it worked only as a side effect of
          # bumping the resourceVersion).
          #
          # With seconds, every refresh bumps the resourceVersion, which also
          # turns ESO's own force-sync into a working "re-assert the superuser
          # password now" button:
          #   kubectl -n database annotate externalsecret cloudnative-pg \
          #     force-sync="$(date +%s)" --overwrite
          # (`flux reconcile` alone will not do it — an unchanged manifest
          # leaves the ExternalSecret's resourceVersion untouched, so ESO's
          # shouldRefresh stays false until the interval is next due.)
          externalsecrets.io/last-synced: "{{ now | date \"2006-01-02T15:04:05\" }}"
      data:
        # Superuser credentials (from cloudnative-pg)
        username: "{{ .POSTGRES_SUPER_USER }}"
        password: "{{ .POSTGRES_SUPER_PASS }}"
        # pgBackRest B2 - shared (from backblaze)
        b2-access-key-id: "{{ .BACKBLAZE_PGBACKREST_ACCESS_KEY }}"
        b2-secret-access-key: "{{ .BACKBLAZE_PGBACKREST_SECRET_ACCESS_KEY }}"
        # pgBackRest R2 - shared (from cloudflare)
        r2-access-key-id: "{{ .CLOUDFLARE_PGBACKREST_ACCESS_KEY }}"
        r2-secret-access-key: "{{ .CLOUDFLARE_PGBACKREST_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: backblaze
    - extract:
        key: cloudflare
