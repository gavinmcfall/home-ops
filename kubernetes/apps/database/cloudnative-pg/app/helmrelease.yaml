---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: openebs
      namespace: openebs-system
  values:
    # Two copies on different nodes, one elected leader (`--leader-elect` is
    # already on). With one copy, rebooting its node left the clusters with no
    # operator for about 51s (2026-11-13 stanton-01 reboot), and nothing can
    # fail a database over while the operator is away.
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
            app.kubernetes.io/instance: cloudnative-pg
    crds:
      create: true
    config:
      data:
        INHERITED_ANNOTATIONS: kyverno.io/ignore
    # Allow scheduling on pyro-01 (GPU worker) as a fallback. The operator
    # owns CNPG cluster reconciliation; if it goes Pending due to no fit
    # on any stanton, postgres clusters can't recover from any disruption.
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoExecute
