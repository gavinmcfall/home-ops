---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: well-played
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: well-played-secret
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://{{ .WELL_PLAYED_POSTGRES_USER }}:{{ .WELL_PLAYED_POSTGRES_PASSWORD }}@postgres18-cluster-pooler.database.svc.cluster.local:5432/well_played
        INIT_POSTGRES_DBNAME: well_played
        INIT_POSTGRES_HOST: postgres18-cluster-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .WELL_PLAYED_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .WELL_PLAYED_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # Sign-in: a Pocket ID client registered by hand (callback .../api/auth/callback).
        OIDC_ISSUER: "https://id.${SECRET_DOMAIN}"
        OIDC_CLIENT_ID: "{{ .WELL_PLAYED_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .WELL_PLAYED_OIDC_CLIENT_SECRET }}"
        OIDC_REDIRECT_URI: "https://well-played.${SECRET_DOMAIN}/api/auth/callback"
        OIDC_POST_LOGOUT_REDIRECT_URI: "https://well-played.${SECRET_DOMAIN}/"
        # Chat replies, billed per token by OpenRouter.
        OPENROUTER_API_KEY: "{{ .WELL_PLAYED_OPENROUTER_API_KEY }}"
  dataFrom:
    # 1Password item `well-played` must provide: WELL_PLAYED_POSTGRES_USER,
    # WELL_PLAYED_POSTGRES_PASSWORD (URL-safe: it is embedded in DATABASE_URL),
    # WELL_PLAYED_OIDC_CLIENT_ID, WELL_PLAYED_OIDC_CLIENT_SECRET, WELL_PLAYED_OPENROUTER_API_KEY,
    # WELL_PLAYED_GHCR_TOKEN (read:packages only; the cluster pulls the private image with it).
    - extract:
        key: well-played
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# ghcr.io/gavinmcfall/well-played is private (built from a private repo): pull with a token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: well-played-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: well-played-ghcr-pull-secret
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "gavinmcfall:%s" .WELL_PLAYED_GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: well-played
