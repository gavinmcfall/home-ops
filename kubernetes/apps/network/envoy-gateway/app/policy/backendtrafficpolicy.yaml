---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-gateway-backend
spec:
  # `compressor`, not `compression`: the old field is deprecated and removed in
  # Envoy Gateway v1.11. Same item shape. Order matters: the first entry is
  # preferred when the client accepts several.
  compressor:
    # Each entry needs its settings block, even empty: with `compressor`, Envoy Gateway
    # silently drops an entry whose matching block is absent, which turns compression off.
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  connection:
    bufferLimit: 8Mi
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
