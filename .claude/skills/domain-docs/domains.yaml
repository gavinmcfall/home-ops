# Domain membership registry — the only source of truth for docs/domains/.
# Resolution: namespaces minus exclude plus include. Paths are <ns>/<app>.
# Apps in a claimed namespace that resolve to no domain appear in `task audit` drift.
domains:
  downloads:
    title: Downloads Infrastructure
    namespaces: [downloads]
    exclude:
      # media-type-specific apps documented in their consuming domain:
      - downloads/arr-codec-tagger   # media
      - downloads/bazarr             # media
      - downloads/bazarr-foreign     # media
      - downloads/bazarr-uhd         # media
      - downloads/bindery            # reading
      - downloads/kapowarr           # reading
      - downloads/lidarr             # music (no domain yet — intentional drift)
      - downloads/lncrawl            # reading
      - downloads/radarr             # media
      - downloads/radarr-uhd         # media
      - downloads/recyclarr          # media
      - downloads/rom-ingest         # games (no domain yet — intentional drift)
      - downloads/shelfmark          # reading
      - downloads/sonarr             # media
      - downloads/sonarr-foreign     # media
      - downloads/sonarr-uhd         # media
      - downloads/soularr            # music (no domain yet — intentional drift)
      - downloads/suwayomi           # reading
      - downloads/tranga             # reading
    include: []
    seeds: []
    descriptions:
      autobrr: IRC/RSS release automation — filters torrent/usenet announces and pushes matching releases to download clients
      cross-seed: Cross-seeds releases across trackers by matching new torrents against the existing library
      dashbrr: Unified dashboard aggregating status from Prowlarr, Radarr, Sonarr, Seerr, and Plex
      flaresolverr: Proxy that solves Cloudflare/DDoS-Guard challenges on behalf of indexers
      metube: Web UI front-end for yt-dlp video downloads
      prowlarr: Torrent/NZB Indexer Management
      qbittorrent: Torrent Client, routed through gluetun/ProtonVPN
      qui: Web UI for managing multiple qBittorrent instances
      sabnzbd: NZB Download Client
      slskd: Soulseek Client, routed through gluetun/ProtonVPN
      tqm: Scheduled qBittorrent queue manager — retags and removes torrents per tracker rules
      unpackerr: Extracts completed archive downloads and notifies Sonarr/Radarr
  media:
    title: Movies & TV
    namespaces: []
    include:
      - downloads/arr-codec-tagger
      - downloads/bazarr
      - downloads/bazarr-foreign
      - downloads/bazarr-uhd
      - downloads/radarr
      - downloads/radarr-uhd
      - downloads/recyclarr
      - downloads/sonarr
      - downloads/sonarr-foreign
      - downloads/sonarr-uhd
      - entertainment/plex
      - entertainment/seerr
      - entertainment/tautulli
      - entertainment/wizarr
    exclude: []
    seeds: [docs/Guides/plex-arr-monitoring-stack.md]
    descriptions:
      arr-codec-tagger: Weekly CronJob that tags Sonarr/Radarr libraries with codec metadata via the kait image
      recyclarr: Daily CronJob that syncs TRaSH Guides quality profiles and custom formats into Sonarr/Radarr
  reading:
    title: Books, Audiobooks, Comics & Manga
    namespaces: []
    include:
      - downloads/bindery
      - downloads/kapowarr
      - downloads/lncrawl
      - downloads/shelfmark
      - downloads/suwayomi
      - downloads/tranga
      - entertainment/audiobookshelf
      - entertainment/bookorbit
      - entertainment/kavita
      - entertainment/komf
      - entertainment/mangarr
      - home/calibre-web-automated
      - home/ebook-reconcile
    exclude: []
    seeds: [docs/ai-context/nerdz-reading-stack.md]
    descriptions:
      bindery: Readarr replacement — book/audiobook manager backed by SQLite, imports metadata-first without moving files
      bookorbit: Family reading hub — library + web readers, OPDS server, KOSync/Kobo sync, Hardcover/StoryGraph sync (trial)
      calibre-web-automated: Web-based Calibre library manager with automated metadata/format conversion; also runs a headless Calibre Content Server
      ebook-reconcile: Nightly CronJobs that embed Calibre metadata into library files and reconcile hardlinks into the AudiobookShelf tree
  auth:
    title: Authentication & Identity
    namespaces: [security]
    include: []
    exclude: []
    seeds:
      - docs/ai-context/NETWORKING.md
      - docs/Guides/Security/Pocket ID + Tailscale SSO/README.md
  observability:
    title: Observability
    namespaces: [observability]
    include: []
    exclude: []
    seeds:
      - docs/observability-audit-2026-05.md
      - docs/infrastructure-roadmap/otel-telemetry-backbone.md
