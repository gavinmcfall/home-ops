---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBERNETES_RESOURCES_DIR: "{{.ROOT_DIR}}/.taskfiles/Kubernetes/resources"
  # Placeholder cluster-secrets so flate can substitute ${VARS} offline.
  FLATE_SUPPLY: "{{.ROOT_DIR}}/.github/flate/supply.yaml"
  # Render against the Kubernetes version the cluster runs.
  FLATE_KUBE_VERSION:
    sh: yq '.kubernetesVersion' {{.KUBERNETES_DIR}}/bootstrap/talos/talconfig.yaml | sed 's/^v//'
  # Shared by every flate invocation. Keep in step with .github/workflows/flate.yaml.
  FLATE_ARGS: >-
    --kube-version {{.FLATE_KUBE_VERSION}}
    --allow-missing-kinds Secret
    --supply {{.FLATE_SUPPLY}}
    --no-progress

tasks:
  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: resource }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      resource: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods

  validate:
    desc: Validate the Flux tree before committing (renders everything with flate)
    summary: |
      The pre-commit check. Renders everything (`kubernetes:flate`), then
      schema-checks the result (`kubernetes:schemas`).
    cmds:
      - task: flate
      - task: schemas

  flate:
    desc: Render the whole Flux tree offline with flate (the same check CI runs)
    summary: |
      Renders every Kustomization and HelmRelease from the repository root and
      fails if any of them does not render. No cluster access, no containers.

      Extra flate arguments can be passed after `--`.
    dir: "{{.ROOT_DIR}}"
    cmd: flate test all {{.FLATE_ARGS}} {{.CLI_ARGS}}
    preconditions:
      - msg: flate is not installed - https://github.com/home-operations/flate/releases
        sh: command -v flate
      - msg: Missing {{.FLATE_SUPPLY}} - run `task kubernetes:flate-supply`
        sh: test -f {{.FLATE_SUPPLY}}

  schemas:
    desc: Schema-check the rendered manifests with kubeconform
    summary: |
      flate proves the tree renders; it does not check the result against
      schemas. This pipes the rendered output through kubeconform.

      Neither CRD catalogue below is generated from THIS cluster. This repo's
      own publisher (.github/workflows/schemas.yaml, meant for
      kubernetes-schemas.nerdz.cloud) has failed on every run for months: the
      Cloudflare Pages project it deploys to does not exist. Until that is
      restored the check leans on two community catalogues:
        - kubernetes-schemas.pages.dev first, because it knows the VolSync
          kopia fork this cluster runs;
        - k8s-schemas.home-operations.com second.

      AutoscalingRunnerSet is skipped: both catalogues predate
      spec.listenerConfig, which the CRD installed here does have (checked
      against the live CRD on 2026-11-13). Drop the skip once the schemas come
      from this cluster.
    dir: "{{.ROOT_DIR}}"
    cmd: >-
      flate build all {{.FLATE_ARGS}} -o yaml
      | kubeconform -strict -ignore-missing-schemas -summary
      -skip AutoscalingRunnerSet
      -kubernetes-version {{.FLATE_KUBE_VERSION}}
      -schema-location default
      -schema-location 'https://kubernetes-schemas.pages.dev/{{`{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}`}}.json'
      -schema-location 'https://k8s-schemas.home-operations.com/{{`{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}`}}.json'
      -
    preconditions:
      - msg: flate is not installed - https://github.com/home-operations/flate/releases
        sh: command -v flate
      - msg: kubeconform is not installed
        sh: command -v kubeconform

  flate-supply:
    desc: Regenerate the placeholder secrets flate renders with (after adding a namespace or a cluster-secrets key)
    dir: "{{.ROOT_DIR}}"
    cmd: python {{.SCRIPTS_DIR}}/flate-supply.py {{.ROOT_DIR}}

  .reset:
    internal: true
    cmd: rm -rf {{.KUBERNETES_DIR}}

  sync-secrets:
    desc: Sync ExternalSecret resources from provider
    summary: |
      ns: Namespace to sync secret in (default: default)
      secret: Secret to sync (default: unset/all secrets)
    cmd: |
      {{if eq .secret ""}}
        kubectl get externalsecret --all-namespaces --no-headers -A | awk '{print $1, $2}' \
          | xargs --max-procs=2 -l bash -c 'kubectl -n $0 annotate externalsecret $1 force-sync=$(date +%s) --overwrite'
      {{else}}
        kubectl --namespace {{.ns}} annotate externalsecret {{.secret}} force-sync=$(date +%s) --overwrite
      {{end}}
    vars:
      secret: '{{ .secret | default ""}}'
      ns: '{{.ns | default "default"}}'
      cluster: '{{.cluster | default "main"}}'
    preconditions:
      - kubectl --namespace {{.ns}} get externalsecret {{.secret}}

  network:
    desc: Create a netshoot container for a cluster
    summary: |
      Args:
        ns: Namespace the PVC is in (default: default)
    interactive: true
    cmd: |
      kubectl run -n {{.ns}} netshoot --rm -i --tty --image ghcr.io/nicolaka/netshoot:latest {{.CLI_ARGS}}
    vars:
      ns: '{{.ns | default "default"}}'

  privileged:
    desc: Run a privileged pod
    cmd: |
      echo "Using envsubst: $(which envsubst)"
      kubectl run privileged-{{.node}} -i --rm --image=null \
        --overrides="$(yq {{.KUBERNETES_RESOURCES_DIR}}/privileged-pod.tmpl.yaml -o=json | envsubst)"
    env:
      node: "{{.node}}"
    preconditions:
      - which envsubst
      - test -f {{.KUBERNETES_RESOURCES_DIR}}/privileged-pod.tmpl.yaml
